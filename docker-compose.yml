version: '3.9'

services:
  # -------------------------
  # 1. DATABASE (GOLD LAYER)
  # -------------------------
  postgresql_db:
    image: ankane/pgvector:v0.5.1 # PostgreSQL with pgvector extension
    container_name: postgresql_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-crawl_jobs_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crawl_jobs_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # 2. CACHE & QUEUE
  # -------------------------
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # 3. OBJECT STORAGE (BRONZE)
  # -------------------------
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-password}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    restart: always
    volumes:
      - minio_data:/data

  # -------------------------
  # 4. ORCHESTRATION (DAGSTER)
  # -------------------------
  dagster_webserver:
    build:
      context: ./data/dagster
    container_name: dagster_webserver
    entrypoint:
      - dagster-webserver
      - -h
      - '0.0.0.0'
      - -p
      - '3000'
      - -w
      - workspace.yaml
    ports:
      - '3000:3000'
    environment:
      DAGSTER_POSTGRES_USER: ${DB_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: ${DB_NAME:-crawl_jobs_db}
      DAGSTER_PG_HOST: postgresql_db
      DAGSTER_HOME: /opt/dagster/app
    volumes:
      - ./data/dagster:/opt/dagster/app
    depends_on:
      - postgresql_db

  dagster_daemon:
    build:
      context: ./data/dagster
    container_name: dagster_daemon
    entrypoint:
      - dagster-daemon
      - run
    environment:
      DAGSTER_POSTGRES_USER: ${DB_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      DAGSTER_POSTGRES_DB: ${DB_NAME:-crawl_jobs_db}
      DAGSTER_PG_HOST: postgresql_db
      DAGSTER_HOME: /opt/dagster/app
    volumes:
      - ./data/dagster:/opt/dagster/app
    depends_on:
      - postgresql_db

  # -------------------------
  # 5. SEMANTIC LAYER (CUBE)
  # -------------------------
  cubejs:
    image: cubejs/cube:latest
    container_name: cubejs
    ports:
      - '4000:4000'
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgresql_db
      CUBEJS_DB_PORT: 5432
      CUBEJS_DB_NAME: ${DB_NAME:-crawl_jobs_db}
      CUBEJS_DB_USER: ${DB_USER:-postgres}
      CUBEJS_DB_PASS: ${DB_PASSWORD:-postgres}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-my-secret-key}
      CUBEJS_DEV_MODE: 'true'
    volumes:
      - ./data/semantic:/cube/conf
    depends_on:
      postgresql_db:
        condition: service_healthy

  # -------------------------
  # 6. BI & ANALYTICS
  # -------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - '3001:3000'
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${DB_NAME:-crawl_jobs_db}
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER:-postgres}
      MB_DB_PASS: ${DB_PASSWORD:-postgres}
      MB_DB_HOST: postgresql_db
    depends_on:
      postgresql_db:
        condition: service_healthy
    restart: always

  # -------------------------
  # 7. WEB PORTAL
  # -------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: crawl_web
    ports:
      - '3400:3400'
    environment:
      DATABASE_URL: 'postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgresql_db:5432/${DB_NAME:-crawl_jobs_db}'
      REDIS_URL: 'redis://redis:6379/1'
    depends_on:
      postgresql_db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
