name: Polaris CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crawl_jobs_db
      NEXT_PUBLIC_SITE_URL: http://localhost:3400
      AUTH_SECRET: ci-only-placeholder
      ALERT_TOKEN_SECRET: ci-only-placeholder
      INTERNAL_DIGEST_TOKEN: ci-only-placeholder
      INTERNAL_VECTORIZER_TOKEN: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install ruff==0.12.3 "SQLAlchemy>=2.0,<3"
      - run: python -m compileall -q data/dagster scripts legacy/airflow/airflow
      - run: ruff check data/dagster scripts legacy/airflow/airflow
      - run: python -m unittest discover -s data/dagster/tests -p "test_*.py"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
