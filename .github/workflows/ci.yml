name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
        working-directory: ./apps/web
      - run: npm run build
        working-directory: ./apps/web
        env:
          SKIP_ENV_VALIDATION: '1'
