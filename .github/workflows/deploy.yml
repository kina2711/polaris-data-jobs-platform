name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          command_timeout: 20m
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/crawl_job_data_pipeline
            # Clean leftover one-shot scripts scp'd lên server trước đó.
            # Tránh "untracked working tree files would be overwritten" khi
            # commit mới có cùng tên script.
            [ -d scripts ] && git clean -fd scripts/ || true
            git pull origin main
            SHA=$(git rev-parse --short HEAD)
            IMAGE=$(docker compose config --images | head -1)
            docker compose build
            docker tag "$IMAGE:latest" "$IMAGE:$SHA"
            docker compose --profile ops run --rm migrate
            docker compose up -d --force-recreate --no-deps app
            docker image prune -f --filter "until=24h"
            echo "=== crawl_job_data_pipeline production deployed @ $SHA (image: $IMAGE:$SHA) ==="
