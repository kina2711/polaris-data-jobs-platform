name: Job Alert Digest (manual fallback)

on:
  # Schedule disabled 2026-05-05: digest đã chuyển sang crontab root server
  # server (8h sáng VN). Workflow này giữ lại như fallback thủ công qua
  # workflow_dispatch khi cron server lỗi.
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/internal/digest
        env:
          TOKEN: ${{ secrets.INTERNAL_DIGEST_TOKEN }}
        run: |
          set -eo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::INTERNAL_DIGEST_TOKEN not set"
            exit 1
          fi
          response=$(curl -sS -w "\n__HTTP__%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 600 \
            https://jobs.example.com/api/internal/digest)
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1 | sed 's/__HTTP__//')
          echo "HTTP $code"
          echo "$body" | head -c 2000
          if [ "$code" != "200" ]; then
            echo "::error::digest endpoint returned $code"
            exit 1
          fi
