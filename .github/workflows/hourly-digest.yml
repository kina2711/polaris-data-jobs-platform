name: Polaris Hourly Job Alert Digest

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: polaris-hourly-digest
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger due Polaris digests
        env:
          POLARIS_WEB_URL: ${{ secrets.POLARIS_WEB_URL }}
          INTERNAL_DIGEST_TOKEN: ${{ secrets.INTERNAL_DIGEST_TOKEN }}
        run: |
          test -n "$POLARIS_WEB_URL"
          test -n "$INTERNAL_DIGEST_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 300 \
            -X POST "${POLARIS_WEB_URL%/}/api/internal/digest" \
            -H "Authorization: Bearer ${INTERNAL_DIGEST_TOKEN}"
