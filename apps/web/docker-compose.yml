services:
  app:
    build: .
    container_name: ${APP_NAME:-polaris_web}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3400
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - '${APP_PORT:-3400}:3400'
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3400/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # One-shot container chạy prisma migrate deploy cho các model jobs own
  # (JobAlert + JobAlertDelivery). Dùng stage `builder` để có đầy đủ
  # node_modules + schema + migrations folder. Profile `ops` để không start
  # trong `docker compose up` bình thường.
  # CI gọi: docker compose --profile ops run --rm migrate
  migrate:
    profiles: ['ops']
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
    command: ['npx', 'prisma', 'migrate', 'deploy']
